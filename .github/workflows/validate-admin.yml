name: Validate Admin Panel
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [connect-firebase-worker-admin]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build admin panel
        run: npm run build
